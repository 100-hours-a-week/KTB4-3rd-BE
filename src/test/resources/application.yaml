spring:
  application:
    name: moyeota
  jackson:
    time-zone: Asia/Seoul
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:mem:moyeota-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

moyeota:
  auth:
    jwt:
      secret: test-only-moyeota-access-token-secret-0123456789
      issuer: moyeota
      access-token-ttl: 30m
    refresh:
      ttl: 7d
      grace: 10s
    signup:
      ttl: 15m
    cookie:
      secure: false
  crypto:
    account-key: bG9jYWwtb25seS1tb3llb3RhLWFjY291bnQta2V5ISE=
  oauth:
    front-callback-uri: http://localhost:3000/auth/callback
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
      redirect-uri: http://localhost:8080/auth/kakao/callback
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
  cors:
    allowed-origins:
      - http://localhost:3000
