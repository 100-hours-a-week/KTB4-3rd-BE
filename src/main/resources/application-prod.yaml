spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

moyeota:
  auth:
    jwt:
      secret: ${JWT_SECRET}
  crypto:
    account-key: ${ACCOUNT_ENC_KEY}
  oauth:
    front-callback-uri: ${FRONT_CALLBACK_URI}
    extra-front-origins: ${EXTRA_FRONT_ORIGINS:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      public-base-url: ${IMAGE_PUBLIC_BASE_URL:}
  cors:
    allowed-origins:
      - ${FRONT_URL}
