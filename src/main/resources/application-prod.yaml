spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: moyeota-main

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

management:
  server:
    # Prometheus scrape traffic uses a separate port. Publish this port only
    # on the EC2 private interface and allow it only from the monitoring SG.
    port: ${MANAGEMENT_SERVER_PORT:8090}
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 1s,2500ms
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  otlp:
    metrics:
      export:
        # Micrometer OTLP is enabled by default once the registry is on the classpath.
        # Keep it off unless the deployment sets OTLP_METRICS_ENABLED=true.
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 30s
  # OTLP 리소스 속성은 Boot 4의 OpenTelemetry 설정으로 준다 (management.otlp.metrics.export.resource-attributes는 Boot 4.1.1에 없어서 무시된다).
  # stage·service는 pull 라벨과 맞춘다 (Prometheus가 stage·service 라벨로 승격한다).
  opentelemetry:
    resource-attributes:
      service.name: ${APP_ROLE:rest}
      service.namespace: ${OTLP_SERVICE_NAMESPACE:}
      deployment.environment: ${STAGE:dev}
      stage: ${STAGE:dev}
      service: ${APP_ROLE:rest}
      service.instance.id: ${ECS_TASK_ID:${HOSTNAME:unknown}}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${APP_ROLE:rest}

moyeota:
  auth:
    jwt:
      secret: ${JWT_SECRET}
  crypto:
    account-key: ${ACCOUNT_ENC_KEY}
  oauth:
    front-callback-uri: ${FRONT_CALLBACK_URI}
    extra-front-origins: ${EXTRA_FRONT_ORIGINS:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
  kakao-unlink:
    admin-key: ${KAKAO_ADMIN_KEY:}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      public-base-url: ${IMAGE_PUBLIC_BASE_URL:}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${FRONT_URL},${EXTRA_FRONT_ORIGINS:}
  notification:
    push:
      enabled: ${MOYEOTA_NOTIFICATION_PUSH_ENABLED:false}
