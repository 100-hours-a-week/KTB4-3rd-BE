spring:
  application:
    name: moyeota
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false

server:
  port: 8080

moyeota:
  auth:
    jwt:
      issuer: moyeota
      access-token-ttl: 30m
    refresh:
      ttl: 7d
      grace: 10s
    cookie:
      secure: true
  oauth:
    kakao:
      authorize-uri: https://kauth.kakao.com/oauth/authorize
  cors:
    allowed-origins:
      - http://localhost:3000
