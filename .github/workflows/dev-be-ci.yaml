name: BE CI

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}


jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Unit test
        run: ./gradlew --no-daemon test

      - name: Build executable jar
        run: ./gradlew --no-daemon bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_REF_NAME" == develop ]]; then
            image_tag="dev-${GITHUB_SHA:0:7}"
            push_image=true
          elif [[ "$GITHUB_REF_NAME" == release/* ]]; then
            version="${GITHUB_REF_NAME#release/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            image_tag="rc-${version}-${GITHUB_SHA:0:7}"
            push_image=true
          else
            image_tag="pr-${GITHUB_SHA:0:7}"
            push_image=false
          fi

          {
            echo "image_tag=$image_tag"
            echo "push_image=$push_image"
            echo "release_version=${GITHUB_REF_NAME#release/}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          set -Eeuo pipefail

          docker buildx build \
            --file Dockerfile \
            --tag "moyeota-be:${IMAGE_TAG}" \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --build-arg "RELEASE_VERSION=${RELEASE_VERSION}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --cache-from "type=gha,scope=be-${GITHUB_REF_NAME}" \
            --cache-to "type=gha,mode=max,scope=be-${GITHUB_REF_NAME}" \
            --load \
            .

      - name: Configure AWS credentials
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: be-ci-${{ github.run_id }}

      - name: Login to ECR
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image and capture digest
        if: steps.meta.outputs.push_image == 'true'
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "moyeota-be:${IMAGE_TAG}" "$remote_image"
          docker push "$remote_image"

          digest="$(docker buildx imagetools inspect "$remote_image" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          {
            echo "IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}@${digest}"
            echo "TAG=${IMAGE_TAG}"
            echo "SOURCE_SHA=${GITHUB_SHA}"
          } > image.env

      - name: Upload image metadata
        if: steps.meta.outputs.push_image == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: be-image-${{ github.sha }}
          path: image.env
          retention-days: 7
