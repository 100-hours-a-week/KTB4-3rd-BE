name: BE CI

on:
  # PR 은 검증만 수행하고 ECR push 와 배포는 하지 않는다.
  # hotfix/* 는 main 으로 PR 을 보내므로 아래 main 대상 PR 에 포함된다.
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

  # develop, release/* 로의 직접 push 는 branch protection 으로 차단되므로
  # 이 이벤트는 사실상 "PR 이 병합되어 ref 가 전진했을 때"의 push를 의미한다.
  push:
    branches:
      - develop
      - 'release/**'
      
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_NAME: moyeota-be


jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Install dependencies and run unit tests
        run: ./gradlew --no-daemon test

      - name: Build executable jar
        run: ./gradlew --no-daemon bootJar

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          set -Eeuo pipefail

          release_version=""

          if [[ "$GITHUB_REF_NAME" == develop ]]; then
            image_tag="dev-${GITHUB_SHA:0:7}"
            push_image=true
          elif [[ "$GITHUB_REF_NAME" == release/* ]]; then
            version="${GITHUB_REF_NAME#release/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            image_tag="rc-${version}-${GITHUB_SHA:0:7}"
            release_version="$version"
            push_image=true
          elif [[ "$GITHUB_REF_NAME" == hotfix/* ]]; then
            image_tag="hf-${GITHUB_SHA:0:7}"
            push_image=false
          else
            image_tag="pr-${GITHUB_SHA:0:7}"
            push_image=false
          fi

          {
            echo "image_tag=$image_tag"
            echo "push_image=$push_image"
            echo "release_version=$release_version"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          set -Eeuo pipefail

          DOCKER_BUILDKIT=1 docker build \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --build-arg "RELEASE_VERSION=${RELEASE_VERSION}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --cache-from "type=gha,scope=be-${GITHUB_REF_NAME}" \
            --cache-to "type=gha,mode=max,scope=be-${GITHUB_REF_NAME}" \
            --load \
            .
        shell: bash
        
      - name: Configure AWS credentials
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: fe-ci-${{ github.run_id }}

      - name: Login to ECR
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: steps.meta.outputs.push_image == 'true'
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -Eeuo pipefail

          remote_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$remote_image"
          docker push "$remote_image"
